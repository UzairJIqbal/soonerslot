name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: Validate extension
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate manifest and modules
        run: npm run check

      - name: Package for the Chrome Web Store
        run: npm run package

      - uses: actions/upload-artifact@v4
        with:
          name: soonerslot-extension
          path: dist/*.zip
          if-no-files-found: error
